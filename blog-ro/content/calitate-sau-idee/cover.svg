<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <style>
        .cover-beam { stroke: rgba(255, 255, 255, 0.75); stroke-width: 2; stroke-linecap: round; transform-origin: 200px 70px; animation: beamTilt 6s ease-in-out infinite; }
        .cover-pan { fill: none; stroke: rgba(255, 255, 255, 0.6); stroke-width: 1.6; }
        .cover-pan.left { animation: panLeft 6s ease-in-out infinite; }
        .cover-pan.right { animation: panRight 6s ease-in-out infinite; }
        .cover-post { stroke: rgba(255, 255, 255, 0.3); stroke-width: 1.4; }

        @keyframes beamTilt {
            0%, 100% { transform: rotate(-7deg); }
            50% { transform: rotate(7deg); }
        }

        @keyframes panLeft {
            0%, 100% { transform: translateY(-5px); }
            50% { transform: translateY(11px); }
        }

        @keyframes panRight {
            0%, 100% { transform: translateY(11px); }
            50% { transform: translateY(-5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cover-beam, .cover-pan.left, .cover-pan.right { animation: none; }
        }
    </style>

    <line class="cover-post" x1="200" y1="70" x2="200" y2="176"/>
    <line class="cover-post" x1="168" y1="176" x2="232" y2="176"/>
    <line class="cover-beam" x1="108" y1="70" x2="292" y2="70"/>
    <path class="cover-pan left" d="M84,86 h48 l-12,26 h-24 z"/>
    <path class="cover-pan right" d="M268,86 h48 l-12,26 h-24 z"/>
</svg>