            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.09;
            z-index: 0;

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            background: var(--bz-card);
            border: 1px solid var(--bz-border);
            border-radius: 30px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 3.5rem 2.5rem 3rem;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .logo {
            display: block;
            width: 200px;
            height: auto;
            margin: 0 auto 2.5rem;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
        }

        h1 {
            font-size: clamp(2.1rem, 6vw, 3.1rem);
            font-weight: 400;
            letter-spacing: -0.015em;
            line-height: 1.05;
            text-transform: uppercase;
            text-shadow: 0 0 42px rgba(255, 255, 255, 0.35);
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
        }

        .rule {
            width: 56px;
            height: 1px;
            background: var(--bz-border-strong);
            margin: 1.6rem auto;
            animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
        }

        .lead {
            font-size: clamp(1rem, 2.6vw, 1.125rem);
            line-height: 1.6;
            color: var(--bz-muted);
            max-width: 42ch;
            margin: 0 auto;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }

        .home-btn {
            display: inline-block;
            margin-top: 2.75rem;
            padding: 1rem 2.3rem;
            border: 1px solid var(--bz-border-strong);
            border-radius: 999px;
            color: var(--bz-text);
            text-decoration: none;
            font-size: 0.98rem;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
        }

        .home-btn:hover,
        .home-btn:focus-visible {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }

        .site-footer {
            position: relative;
            z-index: 1;
            margin-top: 2.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.38);
            text-align: center;
        }

        :focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes grow {
            from { opacity: 0; width: 0; }
            to   { opacity: 1; width: 56px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 520px) {
            .card { padding: 2.75rem 1.5rem 2.25rem; border-radius: 24px; }
            .logo { width: 155px; margin-bottom: 2rem; }
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/form-icons/brandzone_logo_feher.png" alt="BrandZone" class="logo">

        <h1>Köszönjük!</h1>
        <div class="rule"></div>
        <p class="lead">Megkaptuk a kitöltött űrlapot. 24 órán belül jelentkezünk.</p>

        <a href="https://brandzone.ro/hu" class="home-btn">Vissza a főoldalra</a>
    </main>

    <p class="site-footer">BRANDZONE &copy; 2026 &middot; Romania &middot; Odorheiu Secuiesc</p>
</body>
</html>
