<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mulțumim | BRANDZONE</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="format-detection" content="telephone=no">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C7R83DEHQP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-C7R83DEHQP');
    </script>

    <style>
        @font-face {
            font-family: 'SF Pro Display';
            src: url('SFPRODISPLAYREGULAR.OTF') format('opentype');
            font-weight: 400;
            font-display: swap;
        }

        :root {
            --bz-bg: #000000;
            --bz-text: #ffffff;
            --bz-muted: rgba(255, 255, 255, 0.62);
            --bz-card: rgba(255, 255, 255, 0.035);
            --bz-border: rgba(255, 255, 255, 0.1);
            --bz-border-strong: rgba(255, 255, 255, 0.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: var(--bz-text);
            background-color: var(--bz-bg);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Fundal: grafica de linii, la fel de discret ca pe site */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('/vonal.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.09;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            background: var(--bz-card);
            border: 1px solid var(--bz-border);
            border-radius: 30px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 3.5rem 2.5rem 3rem;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .logo {
            display: block;
            width: 200px;
            height: auto;
            margin: 0 auto 2.5rem;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
        }

        h1 {
            font-size: clamp(2.1rem, 6vw, 3.1rem);
            font-weight: 400;
            letter-spacing: -0.015em;
            line-height: 1.05;
            text-transform: uppercase;
            text-shadow: 0 0 42px rgba(255, 255, 255, 0.35);
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
        }

        .rule {
            width: 56px;
            height: 1px;
            background: var(--bz-border-strong);
            margin: 1.6rem auto;
            animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
        }

        .lead {
            font-size: clamp(1rem, 2.6vw, 1.125rem);
            line-height: 1.6;
            color: var(--bz-muted);
            max-width: 42ch;
            margin: 0 auto;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }

        .home-btn {
            display: inline-block;
            margin-top: 2.75rem;
            padding: 1rem 2.3rem;
            border: 1px solid var(--bz-border-strong);
            border-radius: 999px;
            color: var(--bz-text);
            text-decoration: none;
            font-size: 0.98rem;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
        }

        .home-btn:hover,
        .home-btn:focus-visible {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }

        .site-footer {
            position: relative;
            z-index: 1;
            margin-top: 2.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.38);
            text-align: center;
        }

        :focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes grow {
            from { opacity: 0; width: 0; }
            to   { opacity: 1; width: 56px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 520px) {
            .card { padding: 2.75rem 1.5rem 2.25rem; border-radius: 24px; }
            .logo { width: 155px; margin-bottom: 2rem; }
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/form-icons/brandzone_logo_feher.png" alt="BrandZone" class="logo">

        <h1>Mulțumim!</h1>
        <div class="rule"></div>
        <p class="lead">Am primit formularul tău. Revenim cu un răspuns în cel mult 24 de ore.</p>

        <a href="https://brandzone.ro/" class="home-btn">Înapoi la pagina principală</a>
    </main>

    <p class="site-footer">BRANDZONE &copy; 2026 &middot; Romania &middot; Odorheiu Secuiesc</p>
</body>
</html>
